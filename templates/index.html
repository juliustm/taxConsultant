{% extends "base.html" %}

{% block content %}
<script>
    // One page of rows, not the whole ledger. Everything after this comes from
    // /api/submissions, so the document stays the same size at 5,000 receipts as at 50.
    //
    // |tojson and never |safe: every string here originated on a page served by
    // somebody else, and tojson escapes the angle brackets so a vendor name holding a
    // closing script tag cannot climb out of this block. Note that the same sequence
    // must not be written literally here either - inside a script element the HTML
    // parser honours it even in a comment, which ends the block early.
    const initialPage = {{ initial_page|tojson }};
    const initialStats = {{ stats|tojson }};
    const initialFilters = {{ filters|tojson }};
    // Keyed on the exception class the pipeline recorded, not on text parsed back out
    // of a message. Sent from the server so this page and /submissions/<id> always say
    // the same thing about the same failure.
    const failureGuidance = {{ failure_guidance|tojson }};
    // Powers the 'Process now' button on the Queued tab. Carries the task-runner
    // secret, exactly as the standalone Queue page this replaced used to.
    const runnerUrl = {{ runner_url|tojson }};
</script>

<div x-data="dashboard()" x-init="init()">

    <!-- In-App Notification Sliders -->
    <div aria-live="assertive" class="pointer-events-none fixed inset-0 flex items-start px-4 py-6 sm:p-6 z-50">
        <div class="flex w-full flex-col items-start space-y-4">
            <template x-for="notification in notifications" :key="notification.id">
                <div x-show="notification.show"
                     x-transition:enter="transform ease-out duration-300 transition"
                     x-transition:enter-start="translate-y-2 opacity-0 sm:translate-y-0 sm:translate-x-2"
                     x-transition:enter-end="translate-y-0 opacity-100 sm:translate-x-0"
                     x-transition:leave="transition ease-in duration-100"
                     x-transition:leave-start="opacity-100"
                     x-transition:leave-end="opacity-0"
                     class="pointer-events-auto w-full max-w-sm overflow-hidden rounded-lg bg-white shadow-lg ring-1 ring-black ring-opacity-5">
                    <div class="p-4">
                        <div class="flex items-start">
                            <div class="flex-shrink-0" x-html="notification.icon"></div>
                            <div class="ml-3 w-0 flex-1 pt-0.5">
                                <p class="text-sm font-medium text-gray-900" x-text="notification.title"></p>
                                <p class="mt-1 text-sm text-gray-500" x-text="notification.message"></p>
                            </div>
                            <div class="ml-4 flex flex-shrink-0">
                                <button @click="notification.show = false" type="button" class="inline-flex rounded-md bg-white text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                                    <span class="sr-only">Close</span>
                                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" /></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Header -->
    <div class="md:flex md:items-center md:justify-between">
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">Receipts Dashboard</h1>
        <div class="mt-4 flex flex-shrink-0 items-center gap-x-3 md:ml-4 md:mt-0">
            <!-- Whether this page is actually being told about new receipts. Without it,
                 a feed that has died looks exactly like an afternoon with no receipts,
                 and the first sign of trouble is a number that turns out to be hours old. -->
            <span class="inline-flex items-center gap-x-1.5 rounded-md px-2 py-1 text-xs font-medium"
                  :class="live ? 'bg-green-50 text-green-700 ring-1 ring-inset ring-green-600/20' : 'bg-gray-50 text-gray-600 ring-1 ring-inset ring-gray-500/20'"
                  :title="live ? 'Receiving updates as they happen' : 'Not connected - refreshing on a timer instead'">
                <span class="h-1.5 w-1.5 rounded-full" :class="live ? 'bg-green-500' : 'bg-gray-400 animate-pulse'"></span>
                <span x-text="live ? 'Live' : 'Reconnecting'"></span>
            </span>
             <button @click="enableBrowserNotifications()" type="button" class="inline-flex items-center rounded-md px-3 py-2 text-sm font-semibold shadow-sm" :class="browserNotificationsEnabled ? 'bg-green-50 text-green-700 ring-1 ring-inset ring-green-600/20' : 'bg-white text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50'">
                <svg x-show="!browserNotificationsEnabled" class="-ml-0.5 mr-1.5 h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path d="M9.293 2.293a1 1 0 011.414 0l7 7A1 1 0 0117 11h-1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-3a1 1 0 00-1-1H9a1 1 0 00-1 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-6H3a1 1 0 01-.707-1.707l7-7z" /></svg>
                <svg x-show="browserNotificationsEnabled" class="-ml-0.5 mr-1.5 h-5 w-5 text-green-600" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                <span x-text="browserNotificationsEnabled ? 'Notifications On' : 'Enable Notifications'"></span>
            </button>
        </div>
    </div>

    <!-- Stats Cards: spending by the date on the receipt, against the period before it. -->
    <p class="mt-6 text-sm text-gray-500">Spending by receipt date, against the period before it. Cancelled and test receipts are excluded.</p>
    <div class="mt-2 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
        <template x-for="card in statCards" :key="card.name">
            <div class="relative overflow-hidden rounded-lg bg-white p-5 shadow ring-1 ring-black ring-opacity-5">
                <div class="flex items-start justify-between gap-x-3">
                    <div class="min-w-0 flex-1">
                        <dt class="truncate text-sm font-medium text-gray-500" x-text="card.name"></dt>
                        <!-- One line, always: the figure shrinks with its own length rather
                             than wrapping the currency onto a second row. -->
                        <dd class="mt-1 flex items-baseline gap-x-1 whitespace-nowrap" :title="card.exact">
                            <span class="font-semibold tracking-tight text-gray-900" :class="card.amountClass" x-text="card.amount"></span>
                            <span class="text-xs font-medium text-gray-400">TZS</span>
                        </dd>
                        <dd class="mt-0.5 text-sm text-gray-500" x-text="`${card.count} receipt${card.count === 1 ? '' : 's'}`"></dd>
                    </div>
                    <!-- Rendered inline; the values are numbers from our own API, never text. -->
                    <svg class="h-8 w-16 flex-shrink-0 overflow-visible" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
                        <polyline :points="card.sparkline" fill="none" :stroke="card.trendStroke" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
                    </svg>
                </div>
                <div class="mt-3 flex items-center gap-x-2 border-t border-gray-100 pt-3 text-sm">
                    <template x-if="card.delta !== null">
                        <span class="inline-flex items-center gap-x-1 font-medium" :class="card.deltaClass">
                            <span x-text="card.delta > 0 ? '▲' : (card.delta < 0 ? '▼' : '–')"></span>
                            <span x-text="`${Math.abs(card.delta)}%`"></span>
                        </span>
                    </template>
                    <span class="text-gray-500" x-text="card.comparison"></span>
                </div>
            </div>
        </template>
    </div>

    <!-- Controls & Table Section -->
    <div class="mt-8">
         <div class="sm:flex sm:items-center sm:justify-between">
            <div class="border-b border-gray-200">
                <nav class="-mb-px flex space-x-6" aria-label="Tabs">
                    <template x-for="tabName in tabs" :key="tabName">
                        <button @click="changeTab(tabName)" :class="getTabClass(tabName)" class="whitespace-nowrap border-b-2 px-1 py-4 text-sm font-medium">
                            <span x-text="tabLabels[tabName]"></span>
                            <span class="ml-1.5 rounded-full bg-gray-100 px-2 py-0.5 text-xs font-semibold text-gray-600" x-text="page.tab_counts?.[tabName] ?? 0"></span>
                        </button>
                    </template>
                </nav>
            </div>
             <div class="mt-3 flex items-center space-x-4 sm:ml-4 sm:mt-0">
                <!-- The one thing the old standalone Queue page did that this tab alone
                     doesn't: a manual nudge to the task runner, for when nobody wants to
                     wait for the next scheduled tick. -->
                <a x-show="filters.tab === 'queued' && (page.tab_counts?.queued ?? 0) > 0" x-cloak
                   :href="runnerUrl" target="_blank" rel="noopener"
                   class="inline-flex items-center gap-x-1.5 rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500">
                    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M15.312 11.424a5.5 5.5 0 01-9.201 2.466l-.312-.311h2.433a.75.75 0 000-1.5H3.989a.75.75 0 00-.75.75v4.242a.75.75 0 001.5 0v-2.43l.31.31a7 7 0 0011.712-3.138.75.75 0 00-1.449-.39zm1.23-3.723a.75.75 0 00.219-.53V2.929a.75.75 0 00-1.5 0V5.36l-.31-.31A7 7 0 002.239 8.188a.75.75 0 101.448.389A5.5 5.5 0 0112.888 6.11l.311.31h-2.432a.75.75 0 000 1.5h4.243a.75.75 0 00.53-.219z" clip-rule="evenodd" /></svg>
                    Process now
                </a>
                <!-- The pickers live on Insights now. This page answers 'what came in';
                     that one answers 'what does it add up to', and it is where changing a
                     filter is worth a whole page rather than a column of one. The link
                     carries whatever is already narrowed down, so the trip is not a reset. -->
                <a :href="insightsUrl"
                   class="inline-flex items-center gap-x-1.5 rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
                    Filters &amp; Insights
                    <svg class="h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z" clip-rule="evenodd" /></svg>
                </a>
                <a :href="csvDownloadUrl" class="inline-flex items-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
                    Export CSV
                </a>
                <div class="relative rounded-md shadow-sm">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"><svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" /></svg></div>
                    <input type="search" x-model.debounce.300ms="filters.search" id="search_receipts" class="block w-full rounded-md border-0 py-1.5 pl-10 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" placeholder="Vendor, TIN or code...">
                </div>
            </div>
        </div>

    </div>

    <!-- A filter has to be visible and removable wherever it was arrived at, or the
         table is quietly lying about how much there is. Every selection appears here,
         one chip each, next to what it narrowed the ledger down to - including the ones
         set on Insights and carried back, which is the only sign this page gives that
         it is not showing everything. -->
    <div x-show="activeChips.length" x-cloak class="mt-4 flex flex-wrap items-center gap-2 border-b border-gray-100 pb-3">
        <span class="text-sm text-gray-500">Showing only</span>
        <template x-for="chip in activeChips" :key="chip.id">
            <button @click="chip.remove()" type="button"
                    class="inline-flex items-center gap-x-1.5 rounded-md bg-indigo-50 px-2 py-1 text-sm font-medium text-indigo-700 ring-1 ring-inset ring-indigo-600/20 hover:bg-indigo-100">
                <span class="text-xs font-normal uppercase tracking-wide text-indigo-400" x-text="chip.kind"></span>
                <span class="max-w-[16rem] truncate" x-text="chip.label"></span>
                <span aria-hidden="true">&times;</span>
                <span class="sr-only">Remove this filter</span>
            </button>
        </template>
        <button @click="resetFilters()" type="button" class="text-sm font-medium text-gray-500 underline underline-offset-2 hover:text-gray-700">Clear all</button>
        <span class="ml-auto text-sm tabular-nums text-gray-600" x-text="filterSummary"></span>
    </div>

    <!-- Table -->
    <div class="mt-8 flow-root">
        <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
            <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
                <div class="overflow-hidden shadow ring-1 ring-black ring-opacity-5 sm:rounded-lg">
                    <table class="min-w-full divide-y divide-gray-300">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6"><button @click="sortBy('status')" class="group inline-flex">Status <span x-html="getSortIcon('status')"></span></button></th>
                                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"><button @click="sortBy('vendor_name')" class="group inline-flex">Vendor / Description <span x-html="getSortIcon('vendor_name')"></span></button></th>
                                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"><button @click="sortBy('total_amount')" class="group inline-flex">Amount <span x-html="getSortIcon('total_amount')"></span></button></th>
                                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"><button @click="sortBy('receipt_date')" class="group inline-flex">Date <span x-html="getSortIcon('receipt_date')"></span></button></th>
                                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">Input VAT</th>
                                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">Compliance</th>
                                <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-6"><span class="sr-only">View</span></th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200 bg-white">
                            <template x-for="sub in page.submissions" :key="sub.id">
                                <tr :class="loading ? 'opacity-50' : ''" :data-peek-warm="rowEntities(sub)">
                                    <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm sm:pl-6">
                                        <span x-text="getStatusText(sub)" :class="getStatusClass(sub)"></span>
                                    </td>
                                    <td class="px-3 py-4 text-sm text-gray-900">
                                        <div class="font-medium">
                                            <!-- The vendor is a key, not a label: it opens their whole history. -->
                                            <template x-if="vendorKey(sub)">
                                                <a class="peek" data-peek-eager :href="vendorHref(sub)"
                                                   :data-peek="`vendor:${vendorKey(sub)}`"
                                                   x-text="sub.receipt.vendor_name || 'Unnamed vendor'"></a>
                                            </template>
                                            <template x-if="!vendorKey(sub)">
                                                <span x-text="sub.receipt.vendor_name || 'Processing...'"></span>
                                            </template>
                                            <a x-show="sub.receipt.vendor_tin" class="peek ml-1 font-mono text-xs font-normal text-gray-500"
                                               :href="vendorHref(sub)" :data-peek="`vendor:${vendorKey(sub)}`"
                                               x-text="`TIN ${sub.receipt.vendor_tin}`"></a>
                                        </div>
                                        <div class="text-gray-500" x-text="sub.description || 'Awaiting processing'"></div>
                                        <!-- Read off the URL at intake, so it is there even when TRA never answered. -->
                                        <div x-show="!sub.receipt.receipt_id && sub.receipt_code" class="mt-0.5 font-mono text-xs text-gray-400">
                                            <a class="peek" :href="`/submissions/${sub.id}`" :data-peek="`code:${sub.receipt_code}`" x-text="sub.receipt_code"></a>
                                            <span x-show="sub.receipt_time" x-text="` · ${sub.receipt_time}`"></span>
                                        </div>
                                        <div class="mt-1 flex flex-wrap gap-1">
                                            <!-- Who brought this in. A real link to the filtered
                                                 view, so it opens in a tab on cmd-click and answers
                                                 itself on hover; a plain click adds the device to
                                                 whatever is already selected rather than replacing
                                                 it, which is the whole point of a filter that holds
                                                 more than one thing at a time. -->
                                            <a x-show="sub.device_id" class="peek peek-chip inline-flex items-center gap-1 rounded-md bg-white px-2 py-0.5 text-xs font-medium text-gray-600 ring-1 ring-inset ring-gray-200"
                                               :href="hrefWith({ device: withValue('device', sub.device_id) })"
                                               @click="applyOnClick($event, { device: withValue('device', sub.device_id) })"
                                               :data-peek="`device:${sub.device_id}`">
                                                <svg class="h-3 w-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"/>
                                                </svg>
                                                <span x-text="sub.device_name"></span>
                                            </a>
                                            <a x-show="sub.receipt.category" class="peek peek-chip inline-flex items-center rounded-md bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-600"
                                               :href="hrefWith({ category: withValue('category', sub.receipt.category) })"
                                               @click="applyOnClick($event, { category: withValue('category', sub.receipt.category) })"
                                               :data-peek="`category:${sub.receipt.category}`"
                                               x-text="(sub.receipt.category || '').replace(/_/g, ' ')"></a>
                                            <!-- A stored receipt that nothing could categorise. Marked, because
                                                 the alternative is the state it was in before: a row with one
                                                 fewer chip than its neighbours, indistinguishable from a receipt
                                                 that was categorised correctly, and so never fixed. Links to the
                                                 receipt rather than filtering, since the thing to do about it is
                                                 to set one. Never on a cancelled or test receipt: those
                                                 are meant to have no category, and the badge beside the
                                                 amount already says which they are. -->
                                            <a x-show="sub.receipt.receipt_id && !sub.receipt.category && sub.receipt.is_expense !== false"
                                               :href="`/receipts/${sub.receipt.receipt_id}`"
                                               class="inline-flex items-center rounded-md bg-amber-50 px-2 py-0.5 text-xs font-medium text-amber-800 ring-1 ring-inset ring-amber-600/20 hover:bg-amber-100">
                                                Uncategorised
                                            </a>
                                            <span x-show="sub.receipt.items?.length > 1" class="inline-flex items-center rounded-md bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-600" x-text="`${sub.receipt.items.length} items`"></span>
                                            <!-- The paper behind the figures. A scan whose QR code the phone
                                                 read files the photograph alongside it now, so this is on
                                                 verified rows too and not only on ones that had to be read
                                                 by a model - which is the point: the receipt TRA confirmed
                                                 used to have no image anyone could go back to. -->
                                            <a x-show="sub.photo_url" :href="sub.photo_url" target="_blank" rel="noopener"
                                               :data-peek="`photo:${sub.id}`" :data-peek-title="sub.receipt.vendor_name || 'Receipt photograph'"
                                               class="peek peek-chip inline-flex items-center gap-1 rounded-md bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-600 hover:bg-gray-200">
                                                <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.132.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.804-2.169a47.865 47.865 0 00-1.132-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/>
                                                </svg>
                                                Photo
                                            </a>
                                            <template x-for="chip in flagChips(sub)" :key="chip.label">
                                                <span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium" :class="chip.class" x-text="chip.label"></span>
                                            </template>
                                        </div>
                                    </td>
                                    <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                                        <div class="flex items-center">
                                            <span :class="sub.receipt.is_expense === false ? 'text-gray-400 line-through' : ''" x-text="sub.receipt.total_amount_cents !== null && sub.receipt.total_amount_cents !== undefined ? money(sub.receipt.total_amount_cents) : '---'"></span>
                                            <span x-show="sub.receipt.is_cancelled" class="ml-2 inline-flex items-center rounded-md bg-red-50 px-2 py-1 text-xs font-medium text-red-700 ring-1 ring-inset ring-red-600/20">Cancelled</span>
                                            <span x-show="sub.receipt.is_test" class="ml-2 inline-flex items-center rounded-md bg-amber-50 px-2 py-1 text-xs font-medium text-amber-700 ring-1 ring-inset ring-amber-600/20">Test</span>
                                        </div>
                                    </td>
                                    <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                                        <template x-if="sub.receipt.receipt_date">
                                            <a class="peek" :href="hrefWith({ start_date: sub.receipt.receipt_date, end_date: sub.receipt.receipt_date })"
                                               @click="applyOnClick($event, { start_date: sub.receipt.receipt_date, end_date: sub.receipt.receipt_date })"
                                               :data-peek="`date:${sub.receipt.receipt_date}`" x-text="sub.receipt.receipt_date"></a>
                                        </template>
                                        <template x-if="!sub.receipt.receipt_date"><span>---</span></template>
                                    </td>
                                    <td class="whitespace-nowrap px-3 py-4 text-sm">
                                        <template x-if="sub.receipt.assessment && sub.receipt.assessment.input_vat_cents > 0">
                                            <a class="peek block" :href="`/receipts/${sub.receipt.receipt_id}`" :data-peek="`vat:${sub.receipt.receipt_id}`">
                                                <div class="font-medium" :class="sub.receipt.assessment.recoverable_vat_cents > 0 ? 'text-green-700' : 'text-gray-400 line-through'" x-text="money(sub.receipt.assessment.input_vat_cents)"></div>
                                                <div class="text-xs" :class="claimUrgencyClass(sub)" x-text="claimText(sub)"></div>
                                            </a>
                                        </template>
                                        <template x-if="!sub.receipt.assessment || sub.receipt.assessment.input_vat_cents <= 0">
                                            <span class="text-sm text-gray-400" x-text="sub.receipt.assessment ? 'None charged' : '---'"></span>
                                        </template>
                                    </td>
                                    <td class="px-3 py-4 text-sm">
                                        <template x-if="sub.receipt.assessment">
                                            <a class="peek peek-chip flex items-center gap-x-2 px-1 py-0.5"
                                               :href="`/receipts/${sub.receipt.receipt_id}`"
                                               :data-peek="`compliance:${sub.receipt.receipt_id}`">
                                                <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold" :class="scoreClass(sub.receipt.assessment.score)" x-text="sub.receipt.assessment.score === null ? '--' : sub.receipt.assessment.score"></span>
                                                <span class="text-xs text-gray-500" x-text="failureSummary(sub.receipt.assessment)"></span>
                                            </a>
                                        </template>
                                        <template x-if="!sub.receipt.assessment && sub.status === 'failed'">
                                            <div>
                                                <p class="text-xs font-medium text-red-700" x-text="errorTitle(sub)"></p>
                                                <p class="text-xs text-gray-500" x-text="errorDetail(sub)"></p>
                                                <button @click="retry(sub)" :disabled="loading" class="mt-1 rounded bg-white px-2 py-1 text-xs font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 disabled:opacity-50">Send to TRA again</button>
                                            </div>
                                        </template>
                                        <!-- Still trying: say when, so nobody has to guess or read the source. -->
                                        <template x-if="!sub.receipt.assessment && (sub.status === 'queued' || sub.status === 'processing')">
                                            <div>
                                                <p class="text-xs text-gray-600" x-text="retryText(sub)"></p>
                                                <p x-show="sub.failure_reason" class="text-xs text-gray-400" x-text="errorTitle(sub)"></p>
                                            </div>
                                        </template>
                                    </td>
                                    <td class="relative whitespace-nowrap py-4 pl-3 pr-4 text-right text-sm font-medium sm:pr-6">
                                        <template x-if="sub.receipt.receipt_id">
                                            <a :href="`/receipts/${sub.receipt.receipt_id}`" class="text-indigo-600 hover:text-indigo-900">View</a>
                                        </template>
                                        <template x-if="!sub.receipt.receipt_id">
                                            <a :href="`/submissions/${sub.id}`" class="text-indigo-600 hover:text-indigo-900">View</a>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                            <tr x-show="!page.submissions.length">
                                <td colspan="7" class="py-12 text-center text-sm text-gray-500">
                                    <span x-text="anyFilterApplied ? 'No submissions match your criteria.' : 'No receipts here yet. Send one to your secure endpoint to get started.'"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6" x-show="page.total > 0">
                    <p class="text-sm text-gray-700">
                        Showing <span class="font-medium" x-text="rangeStart"></span> to <span class="font-medium" x-text="rangeEnd"></span>
                        of <span class="font-medium" x-text="page.total"></span> results
                    </p>
                    <div class="flex gap-x-2">
                        <button @click="goToPage(page.page - 1)" :disabled="!page.has_prev || loading" class="relative inline-flex items-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 disabled:opacity-40">Previous</button>
                        <span class="inline-flex items-center px-2 text-sm text-gray-500" x-text="`Page ${page.page} of ${Math.max(page.pages || 1, 1)}`"></span>
                        <button @click="goToPage(page.page + 1)" :disabled="!page.has_next || loading" class="relative inline-flex items-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 disabled:opacity-40">Next</button>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</div>

<script>
// --- Sound, unchanged from the original ---
class SoundGenerator {
  constructor() {
    this.audioContext = null;
    this.maxPolyphony = 5;
    this.voicePool = Array(this.maxPolyphony).fill(null);
  }
  init() {
    if (!this.audioContext) {
      try { this.audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { console.error("Web Audio API is not supported."); }
    }
  }
  findFreeVoice() {
    for (let i = 0; i < this.maxPolyphony; i++) { if (!this.voicePool[i]) return i; } return -1;
  }
  createNoiseBuffer(duration, type = 'pink') {
    if (!this.audioContext) return null;
    const bufferSize = Math.floor(duration * this.audioContext.sampleRate);
    const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
    const data = buffer.getChannelData(0);
    if (type === 'pink') {
        let b0=0, b1=0, b2=0;
        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179; b1 = 0.99332 * b1 + white * 0.0750759; b2 = 0.96900 * b2 + white * 0.1538520;
            data[i] = (b0 + b1 + b2) * 0.3;
        }
    } else { for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; } }
    return buffer;
  }
  _play(duration, ...soundParts) {
    if (!this.audioContext) return;
    const now = this.audioContext.currentTime;
    const voiceIndex = this.findFreeVoice();
    if (voiceIndex === -1) return;
    this.voicePool[voiceIndex] = true;
    setTimeout(() => { this.voicePool[voiceIndex] = null; }, duration * 1000);
    soundParts.forEach(part => part(now, this.audioContext));
  }
  playSuccess() {
    this._play(1.5, (now, ctx) => {
        const chime1 = ctx.createOscillator(); chime1.type = 'sine'; chime1.frequency.setValueAtTime(783.99, now);
        const gain1 = ctx.createGain(); gain1.gain.setValueAtTime(0.2, now); gain1.gain.exponentialRampToValueAtTime(0.001, now + 1);
        chime1.connect(gain1).connect(ctx.destination);
        const chime2 = ctx.createOscillator(); chime2.type = 'sine'; chime2.frequency.setValueAtTime(1046.50, now + 0.1);
        const gain2 = ctx.createGain(); gain2.gain.setValueAtTime(0.15, now + 0.1); gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        chime2.connect(gain2).connect(ctx.destination);
        chime1.start(now); chime2.start(now + 0.1); chime1.stop(now + 1); chime2.stop(now + 1.2);
    });
  }
  playQueued() {
    this._play(0.3, (now, ctx) => {
        const osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
        const gain = ctx.createGain(); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.3);
    });
  }
  playFailed() {
    this._play(1, (now, ctx) => {
        const noise = ctx.createBufferSource(); noise.buffer = this.createNoiseBuffer(0.8, 'white');
        const noiseGain = ctx.createGain(); noiseGain.gain.setValueAtTime(0.02, now); noiseGain.gain.linearRampToValueAtTime(0, now + 0.8);
        noise.connect(noiseGain).connect(ctx.destination);
        const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(80, now + 1);
        const gain = ctx.createGain(); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 1);
        osc.connect(gain).connect(ctx.destination);
        noise.start(now); osc.start(now); noise.stop(now + 0.8); osc.stop(now + 1);
    });
  }
  playDuplicate() {
    this._play(0.5, (now, ctx) => {
        const osc = ctx.createOscillator(); osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
        const gain = ctx.createGain(); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.4);
    });
  }
}

// The filters that hold a list rather than a value. Named once, because 'clear
// everything' and 'is anything applied' both have to know which is which, and a filter
// that only one of them knows about is one that cannot be cleared.
const MULTI_FILTERS = ['category', 'device', 'vendor'];

function dashboard() {
    return {
        // --- State ---
        page: initialPage,
        stats: initialStats,
        filters: { ...initialFilters },
        notifications: [],
        browserNotificationsEnabled: false,
        loading: false,
        soundGenerator: new SoundGenerator(),
        tabs: ['processed', 'with_vat', 'queued', 'failed', 'duplicates'],
        tabLabels: { processed: 'Processed', with_vat: 'With VAT', queued: 'Queued', failed: 'Failed', duplicates: 'Duplicates' },
        // Rising edge of a request, so a slow response cannot overwrite a newer one.
        requestId: 0,
        // The live feed's own state. `live` is shown to the user, because a dashboard
        // that has silently stopped updating looks identical to a quiet afternoon.
        live: false,
        lastBeat: 0,
        eventSource: null,
        reloadTimer: null,

        get statCards() {
            const periods = [
                { name: 'Spent Today', key: 'today', comparison: 'vs yesterday' },
                { name: 'Last 7 Days', key: '7d', comparison: 'vs previous 7 days' },
                { name: 'Last 4 Weeks', key: '4w', comparison: 'vs previous 4 weeks' },
                { name: 'Last 12 Months', key: '1y', comparison: 'vs previous 12 months' },
            ];
            return periods.map(period => {
                const data = this.stats[period.key] || {};
                const delta = data.delta_pct ?? null;
                const amount = this.wholeShillings(data.total_cents);
                return {
                    name: period.name,
                    count: data.count || 0,
                    amount,
                    amountClass: this.amountSizeClass(amount),
                    exact: this.money(data.total_cents),
                    delta,
                    comparison: delta === null ? `no spending ${period.comparison.replace('vs ', 'in the ')}` : period.comparison,
                    deltaClass: delta > 0 ? 'text-red-600' : (delta < 0 ? 'text-green-600' : 'text-gray-500'),
                    trendStroke: delta > 0 ? '#dc2626' : (delta < 0 ? '#16a34a' : '#9ca3af'),
                    sparkline: this.sparkline(data.series || []),
                };
            });
        },
        get anyFilterApplied() {
            return Boolean(this.filters.search || this.filters.start_date || this.filters.end_date)
                || MULTI_FILTERS.some(key => this.selected(key).length > 0);
        },

        // --- The filter, which holds more than one of most things --------------
        /* One filter's selected values. Tolerant of a single value written as itself,
           because a link somebody pasted carries `category=fuel` and not an array. */
        selected(key) {
            const value = this.filters[key];
            if (Array.isArray(value)) return value;
            return (value === '' || value === null || value === undefined) ? [] : [value];
        },
        isSelected(key, value) { return this.selected(key).includes(value); },
        /* Replaced rather than mutated: Alpine's deep watch does fire on a push, but a
           new array makes the refetch unambiguous and costs nothing at these sizes. */
        toggle(key, value) {
            const current = this.selected(key);
            const next = current.includes(value)
                ? current.filter(entry => entry !== value)
                : [...current, value];
            this.filters = { ...this.filters, [key]: next };
        },
        withValue(key, value) {
            const current = this.selected(key);
            return current.includes(value) ? current : [...current, value];
        },
        clearFilter(key) { this.filters = { ...this.filters, [key]: [] }; },

        /* The filtered view this link leads to, carrying everything already selected.
           A chip in a row used to navigate to a filter of exactly one thing, which
           silently threw away whatever else the reader had narrowed down to. */
        hrefWith(changes) { return `/?${this.queryString({ page: 1, ...changes })}`; },

        /*
         * Applies the same change in place on a plain click, and otherwise lets the
         * browser follow the link - so cmd-click still opens the filtered view in a new
         * tab, and the address bar still ends up holding the filter either way.
         *
         * Left alone on a touch screen, where the first tap belongs to the hover card
         * (see static/peek.js) and the second one follows the href.
         */
        applyOnClick(event, changes) {
            if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;
            if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
            event.preventDefault();
            this.filters = { ...this.filters, ...changes };
        },

        /*
         * Every applied filter as one removable chip.
         *
         * The rule this enforces is that no filter may be invisible. A table narrowed by
         * something the reader cannot see is a table reporting a total for a question
         * nobody asked, and the only way to find out is to notice that the number is
         * too small - which nobody does.
         */
        get activeChips() {
            const chips = [];
            const clear = (field) => () => { this.filters = { ...this.filters, [field]: '' }; };
            if (this.filters.search) chips.push({ id: 'search', kind: 'matching', label: this.filters.search, remove: clear('search') });
            if (this.filters.start_date) chips.push({ id: 'from', kind: 'from', label: this.filters.start_date, remove: clear('start_date') });
            if (this.filters.end_date) chips.push({ id: 'to', kind: 'to', label: this.filters.end_date, remove: clear('end_date') });
            for (const value of this.selected('category')) {
                chips.push({ id: `category:${value}`, kind: 'category',
                             label: this.facetLabel('categories', value, String(value).replace(/_/g, ' ')),
                             remove: () => this.toggle('category', value) });
            }
            for (const value of this.selected('device')) {
                chips.push({ id: `device:${value}`, kind: 'device',
                             label: this.facetLabel('devices', value, `device ${value}`),
                             remove: () => this.toggle('device', value) });
            }
            for (const value of this.selected('vendor')) {
                chips.push({ id: `vendor:${value}`, kind: 'supplier',
                             label: this.facetLabel('vendors', value, String(value).replace(/^tin:/, 'TIN ')),
                             remove: () => this.toggle('vendor', value) });
            }
            return chips;
        },
        /* A chip's own name, taken from the options the server counted - so a device
           filtered down to nothing is still called by its name rather than its id. */
        facetLabel(kind, value, fallback) {
            const match = (this.page.facets?.[kind] || []).find(option => option.key === value);
            return match ? match.label : fallback;
        },
        /* What the filter narrowed the ledger down to, beside the filter itself. */
        get filterSummary() {
            const insights = this.page.insights || {};
            if (!insights.count) return 'no completed receipts match';
            return `${insights.count} receipt${insights.count === 1 ? '' : 's'} · ${this.money(insights.total_cents)} · VAT ${this.money(insights.vat_cents)}`;
        },

        // --- Where the filter is actually built --------------------------------
        /* Insights holds the pickers and the breakdowns; this page holds the rows. The
           link between them has to carry the narrowing already done, or every trip
           across is a reset - and only the keys that page reads, so a sort order the
           table cares about does not ride along pretending to be a filter. */
        get insightsUrl() {
            const carried = ['search', 'category', 'device', 'vendor', 'start_date', 'end_date'];
            const params = new URLSearchParams();
            for (const key of carried) {
                for (const entry of this.selected(key)) params.append(key, entry);
            }
            const query = params.toString();
            return query ? `/insights?${query}` : '/insights';
        },
        get rangeStart() { return this.page.total ? (this.page.page - 1) * this.page.per_page + 1 : 0; },
        get rangeEnd() { return Math.min(this.page.page * this.page.per_page, this.page.total); },
        get csvDownloadUrl() { return `/export/csv?${this.queryString()}`; },

        // --- Init & listeners ---
        init() {
            this.browserNotificationsEnabled = (window.Notification && Notification.permission === 'granted');
            this.listenForUpdates();
            // Deep-watched: any filter change resets to the first page and refetches.
            this.$watch('filters', () => this.reload(1));
            window.addEventListener('click', () => { this.soundGenerator.init(); }, { once: true });
        },

        /*
         * The live feed, and three separate safety nets under it.
         *
         * The feed alone was the whole mechanism once, and the dashboard sat stale
         * behind a connection that had quietly died until somebody reloaded. So:
         *
         *  1. Every event carries an id, and EventSource resends the last one it saw
         *     as Last-Event-ID, so a reconnect is told what it missed rather than
         *     resuming at "now". Reconnection itself is the browser's job, not ours.
         *  2. A watchdog. The server sends a `ping` event every 15s, so silence longer
         *     than STALE_AFTER_MS means the connection is dead in a way the browser has
         *     not noticed - the failure that is invisible from JavaScript otherwise.
         *     We tear it down and open a new one.
         *  3. A poll, running only while the stream is not live. It is the floor: even
         *     with events failing entirely, the page is never more than POLL_MS stale.
         *
         * Plus the obvious human moments - coming back to the tab, the machine coming
         * back online - because those are exactly when a laptop's stream was killed
         * while it slept.
         */
        listenForUpdates() {
            this.openStream();

            setInterval(() => this.checkStreamHealth(), 5000);
            setInterval(() => { if (!this.live && !document.hidden) this.reload(null, { quiet: true }); }, 20000);

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) return;
                // Both, and in this order: the connection may have been killed while
                // the tab slept, and either way the list on screen is now old.
                this.checkStreamHealth(true);
                this.reload(null, { quiet: true });
            });
            window.addEventListener('online', () => { this.checkStreamHealth(true); this.reload(null, { quiet: true }); });
            window.addEventListener('pageshow', (event) => { if (event.persisted) this.reload(null, { quiet: true }); });
        },

        openStream() {
            if (this.eventSource) { try { this.eventSource.close(); } catch (e) { /* already gone */ } }
            const source = new EventSource("{{ url_for('stream') }}");
            this.lastBeat = Date.now();
            // A connection that has just opened has, by definition, missed whatever
            // happened while it was down. Last-Event-ID replays the events; this
            // refetches the rows, so a missed event that predates this page's cursor
            // (a first connection, a resync) cannot leave the list wrong either.
            source.onopen = () => { this.live = true; this.lastBeat = Date.now(); this.reload(null, { quiet: true }); };
            source.onmessage = (event) => {
                this.live = true;
                this.lastBeat = Date.now();
                try { this.handleSseUpdate(JSON.parse(event.data)); }
                catch (e) { console.error('Unreadable event', e); }
            };
            source.addEventListener('ping', () => { this.live = true; this.lastBeat = Date.now(); });
            source.onerror = () => { this.live = false; };
            this.eventSource = source;
        },

        /* Silence past the server's heartbeat interval means the connection is gone,
           whatever its readyState claims. `force` reconnects regardless, for the
           moments we already know the connection cannot have survived. */
        checkStreamHealth(force = false) {
            if (document.hidden && !force) return;
            const silentFor = Date.now() - (this.lastBeat || 0);
            if (force || silentFor > 45000 || (this.eventSource && this.eventSource.readyState === 2)) {
                this.live = false;
                this.openStream();
            }
        },

        // --- Data ---
        /* A multi-value filter is repeated - `category=fuel&category=meals` - rather
           than joined, because that is the form that survives being pasted around and
           is what the server reads back. Empty values are left out entirely, so a
           cleared filter disappears from the address bar instead of lingering as `=`. */
        queryString(extra = {}) {
            const params = new URLSearchParams();
            const state = { ...this.filters, ...extra };
            for (const [key, value] of Object.entries(state)) {
                for (const entry of (Array.isArray(value) ? value : [value])) {
                    if (entry !== '' && entry !== null && entry !== undefined) params.append(key, entry);
                }
            }
            return params.toString();
        },
        /* Coalesces a burst into one refetch. Ten receipts finishing together used to
           be ten full page requests, each one overtaking the last. */
        scheduleReload(delay = 250) {
            clearTimeout(this.reloadTimer);
            this.reloadTimer = setTimeout(() => this.reload(null, { quiet: true }), delay);
        },
        async reload(page = null, { quiet = false } = {}) {
            const target = page || this.page.page || 1;
            const ticket = ++this.requestId;
            // A refetch nobody asked for must not flash the spinner over a table
            // somebody is reading; one they did ask for still shows it.
            if (!quiet) this.loading = true;
            try {
                const response = await fetch(`/api/submissions?${this.queryString({ page: target })}`, {
                    headers: { 'Accept': 'application/json' },
                });
                if (!response.ok) throw new Error(`Request failed (${response.status})`);
                const payload = await response.json();
                // A response that has been overtaken by a newer request is discarded,
                // otherwise a slow page 1 can land on top of a fast page 2.
                if (ticket === this.requestId) {
                    this.page = payload;
                    this.updateUrlState();
                }
            } catch (error) {
                console.error(error);
                // A background refetch that fails is not the user's problem - the next
                // one is seconds away. Only a refetch they are waiting on is worth a
                // toast, otherwise a flaky connection buries the screen in them.
                if (!quiet) this.addNotification('Could not load receipts', error.message, 'error');
            } finally {
                if (ticket === this.requestId && !quiet) this.loading = false;
            }
        },
        goToPage(page) { if (page >= 1) this.reload(page); },
        changeTab(tabName) { this.filters.tab = tabName; },
        sortBy(column) {
            if (this.filters.sort === column) {
                this.filters.direction = this.filters.direction === 'asc' ? 'desc' : 'asc';
            } else {
                this.filters.sort = column;
                this.filters.direction = 'asc';
            }
        },
        resetFilters() {
            this.filters = {
                ...this.filters, search: '', start_date: '', end_date: '',
                ...Object.fromEntries(MULTI_FILTERS.map(key => [key, []])),
            };
        },

        // --- Peekable values ---
        // Every entity a row points at, so hovering anywhere in the row fetches them
        // before the pointer arrives. See static/peek.js.
        vendorKey(sub) {
            const receipt = sub.receipt || {};
            return receipt.vendor_key || (receipt.vendor_tin ? `tin:${receipt.vendor_tin}` : null);
        },
        vendorHref(sub) {
            const key = this.vendorKey(sub);
            return key ? `/vendors/${encodeURIComponent(key)}` : null;
        },
        rowEntities(sub) {
            const specs = [];
            const key = this.vendorKey(sub);
            if (key) specs.push(`vendor:${key}`);
            if (sub.receipt?.receipt_id) specs.push(`compliance:${sub.receipt.receipt_id}`);
            if (sub.device_id) specs.push(`device:${sub.device_id}`);
            // Warms the photograph too, which is what makes its preview open with no
            // wait: the card's payload carries the image URL, and peek preloads it.
            if (sub.photo_url) specs.push(`photo:${sub.id}`);
            return specs.join(',');
        },
        updateUrlState() { window.history.replaceState({}, '', `${window.location.pathname}?${this.queryString({ page: this.page.page })}`); },

        async retry(sub) {
            try {
                const response = await fetch(`/submissions/${sub.id}/retry`, { method: 'POST' });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || 'Retry was refused.');
                this.addNotification('Back on the queue', `Submission ${sub.id} will be tried again.`, 'info');
                this.reload();
            } catch (error) {
                this.addNotification('Could not retry', error.message, 'error');
            }
        },

        handleSseUpdate({ event_type, data: payload }) {
            // The server admitting it cannot say what we missed. Everything on screen
            // is suspect, so refetch it - the same thing a cold load does.
            if (event_type === 'stream.resync') { this.scheduleReload(0); return; }

            const submissionId = payload.submission_id || payload.id;
            if (!submissionId) return;

            let notification = {}, soundToPlay = null;
            if (event_type === 'submission.processed') {
                this.stats = payload.stats; soundToPlay = 'playSuccess';
                notification = { title: 'Receipt Processed!', message: `ID ${submissionId} processed.`, type: 'success' };
            } else if (event_type === 'submission.failed') {
                soundToPlay = 'playFailed';
                notification = { title: 'Processing Failed', message: `ID ${submissionId} failed.`, type: 'error' };
            } else if (event_type === 'submission.duplicate') {
                soundToPlay = 'playDuplicate';
                notification = { title: 'Duplicate Detected', message: `ID ${submissionId} is a duplicate.`, type: 'warning' };
            } else if (event_type === 'submission.queued') {
                soundToPlay = 'playQueued';
                notification = { title: 'New Receipt Queued', message: `Submission ID ${submissionId} is waiting.`, type: 'info' };
            }

            if (soundToPlay) this.soundGenerator[soundToPlay]();
            if (notification.title) {
                this.addNotification(notification.title, notification.message, notification.type);
                this.showBrowserNotification(notification.title, notification.message);
            }
            // The row's new state, its position under the current sort and the counts on
            // every tab all just changed. Asking the server is both simpler and correct.
            // Debounced, because a runner tick finishes a dozen of these at once and one
            // refetch answers all of them. 'submission.processing' lands here too, with
            // no sound and no notification, so a row starts saying "Checking" the moment
            // it is picked up rather than only once it is finished.
            this.scheduleReload();
        },

        // --- Formatting ---
        money(cents) {
            if (cents === null || cents === undefined) return '---';
            return (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' TZS';
        },
        // The stat cards carry period totals, where cents are noise and cost two
        // characters of width. The exact figure stays on the card's tooltip.
        wholeShillings(cents) {
            if (cents === null || cents === undefined) return '---';
            return Math.round(cents / 100).toLocaleString('en-US');
        },
        // A card is about 180px wide inside its padding and sparkline, so a long
        // figure steps down a size or two instead of spilling out of the card.
        amountSizeClass(amount) {
            if (amount.length > 13) return 'text-lg';
            if (amount.length > 10) return 'text-xl';
            return 'text-2xl';
        },
        sparkline(series) {
            if (!series.length) return '';
            const peak = Math.max(...series, 1);
            const step = series.length > 1 ? 100 / (series.length - 1) : 0;
            // 38..2 so a zero sits on the baseline rather than off the bottom edge.
            return series.map((value, index) => `${(index * step).toFixed(1)},${(38 - (value / peak) * 36).toFixed(1)}`).join(' ');
        },
        scoreClass(score) {
            if (score === null || score === undefined) return 'bg-gray-100 text-gray-600';
            if (score >= 90) return 'bg-green-100 text-green-800';
            if (score >= 70) return 'bg-yellow-100 text-yellow-800';
            return 'bg-red-100 text-red-800';
        },
        failureSummary(assessment) {
            const failed = assessment.failed || [];
            if (!failed.length) return 'All checks pass';
            const labels = { buyer_tin: 'not yours', vendor_vrn: 'no VRN', tax_arithmetic: 'tax mismatch', totals: 'totals off', validity: 'voided', verification: 'unverified', vendor_tin: 'no supplier TIN', claim_window: 'expired', receipt_date: 'undated', input_vat: null };
            const named = failed.map(id => labels[id]).filter(Boolean);
            return named.length ? named.join(', ') : `${failed.length} check(s) failed`;
        },
        flagChips(sub) {
            const assessment = sub.receipt?.assessment;
            if (!assessment) return [];
            const chips = [];
            if (assessment.wht_total_cents > 0) chips.push({ label: `WHT ${this.money(assessment.wht_total_cents)}`, class: 'bg-purple-50 text-purple-700 ring-1 ring-inset ring-purple-600/20' });
            if (assessment.capital_items?.length) chips.push({ label: 'capital asset', class: 'bg-blue-50 text-blue-700 ring-1 ring-inset ring-blue-600/20' });
            for (const entry of (assessment.restrictions || [])) {
                const label = entry.flag.replace(/_/g, ' ');
                if (!chips.some(chip => chip.label === label)) chips.push({ label, class: 'bg-orange-50 text-orange-700 ring-1 ring-inset ring-orange-600/20' });
            }
            return chips;
        },
        claimText(sub) {
            const assessment = sub.receipt.assessment;
            if (assessment.recoverable_vat_cents > 0) {
                const days = assessment.claim_days_left;
                if (days === null || days === undefined) return 'recoverable';
                return days <= 30 ? `${days} day(s) left to claim` : 'recoverable';
            }
            return assessment.recovery_blockers?.[0] || 'not recoverable';
        },
        claimUrgencyClass(sub) {
            const assessment = sub.receipt.assessment;
            if (assessment.recoverable_vat_cents <= 0) return 'text-red-600';
            return (assessment.claim_days_left !== null && assessment.claim_days_left <= 30) ? 'text-amber-600' : 'text-gray-500';
        },
        errorTitle(sub) {
            return failureGuidance[sub.failure_reason]?.title || 'Processing failed';
        },
        errorDetail(sub) {
            const known = failureGuidance[sub.failure_reason];
            if (known) return known.action;
            // Unrecognised failures still show something, but only the first line of it.
            return (sub.error_message || '').split('\n')[0].slice(0, 140) || 'No reason was recorded.';
        },
        // How long until this submission is tried again, said plainly. A row that is
        // already due is waiting for a runner, not for the clock, and says so.
        retryText(sub) {
            const plan = sub.retry || {};
            if (sub.status === 'failed') {
                return plan.attempts_used ? `gave up after ${plan.attempts_used} attempt(s)` : 'not retried';
            }
            if (!plan.next_attempt_at) return 'waiting to be picked up';
            if (plan.due) return 'retry due now';

            const seconds = plan.seconds_until_next_attempt || 0;
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const when = days ? `${days}d ${hours}h` : (hours ? `${hours}h ${minutes}m` : `${minutes}m`);
            const of = plan.attempts_total ? ` (attempt ${plan.attempts_used + 1} of ${plan.attempts_total})` : '';
            return `retries in ${when}${of}`;
        },
        getTabClass(tabName) { return this.filters.tab === tabName ? 'border-indigo-500 text-indigo-600' : 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700'; },
        getSortIcon(column) {
            if (this.filters.sort !== column) return '<svg class="ml-2 h-5 w-5 invisible text-gray-400 group-hover:visible" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path></svg>';
            if (this.filters.direction === 'asc') return '<svg class="ml-2 h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>';
            return '<svg class="ml-2 h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>';
        },
        getStatusClass(sub) {
            if (sub.is_duplicate) return 'inline-flex items-center rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-medium text-blue-800';
            if (sub.status === 'completed') return 'inline-flex items-center rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-800';
            if (sub.status === 'queued' || sub.status === 'processing') return 'inline-flex items-center rounded-full bg-yellow-100 px-2.5 py-0.5 text-xs font-medium text-yellow-800';
            if (sub.status === 'failed') return 'inline-flex items-center rounded-full bg-red-100 px-2.5 py-0.5 text-xs font-medium text-red-800';
            return 'inline-flex items-center rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-800';
        },
        getStatusText(sub) { if (sub.is_duplicate) return 'Duplicate'; return sub.status.charAt(0).toUpperCase() + sub.status.slice(1); },

        // --- Notifications ---
        addNotification(title, message, type = 'info') {
            const icons = {
                success: '<svg class="h-6 w-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>',
                error: '<svg class="h-6 w-6 text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg>',
                warning: '<svg class="h-6 w-6 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" /></svg>',
                info: '<svg class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" /></svg>'
            };
            const id = Date.now() + Math.random();
            this.notifications.unshift({ id, title, message, show: true, icon: icons[type] });
            setTimeout(() => { const index = this.notifications.findIndex(n => n.id === id); if (index > -1) this.notifications[index].show = false; }, 5000);
        },
        enableBrowserNotifications() {
            if (!window.Notification) return;
            if (Notification.permission === 'granted') {
                this.browserNotificationsEnabled = true;
                this.addNotification('Already Enabled', 'Browser notifications are active.', 'success');
                this.soundGenerator.playSuccess();
            } else if (Notification.permission !== 'denied') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        this.browserNotificationsEnabled = true;
                        this.addNotification('Notifications Enabled!', 'You will now receive system notifications.', 'success');
                        this.soundGenerator.playSuccess();
                    }
                });
            }
        },
        showBrowserNotification(title, body) { if (this.browserNotificationsEnabled) { new Notification(title, { body, icon: '/static/logo.png' }); } },
    }
}
</script>
