{# x-show, not x-if: the <video> element and the stream attached to it have to survive
   a trip to History. Unmounting them is the thing that used to cost a camera warm-up
   and, on iOS, a permission prompt. Hiding the root hides the fixed-position overlays
   inside it too, so nothing of the camera screen leaks onto the other views. #}
{# x-cloak matters more here than it used to. All three views are in this document now,
   so between the HTML parsing and Alpine hydrating there is a window in which every
   one of them is laid out at once - a light history sheet stacked under a black camera
   screen - and that window is a cold launch on a slow phone, which is the longest one
   there is. Cloaking costs the scanner nothing visually: the body behind it is already
   black, which is exactly what a viewfinder that has not painted a frame looks like. #}
<div x-data="scannerApp()" x-init="boot()" x-show="active" x-cloak class="h-full">

    <!-- Viewfinder. Always mounted: it is also how a device gets activated. -->
    <video x-ref="video" class="viewfinder" playsinline muted autoplay></video>

    <!-- Sync state. Two different shapes for the same underlying state rather than one
         indicator with a color swap - offline is the one state a driving, half-looking
         user has to notice without reading anything, so it gets the whole width and
         the word itself, not just a dot that changed color. -->
    <template x-if="!!session && online">
        <button type="button" class="sync-pill" x-cloak x-transition.opacity.duration.200ms
                @click="toggleIsland()">
            <span class="sync-dot" :class="dotClass"></span>
            <span x-text="syncLabel"></span>
        </button>
    </template>
    <template x-if="!!session && online && islandExpanded">
        <div class="sync-events" x-cloak
             x-transition:enter="transition ease-out duration-150"
             x-transition:enter-start="opacity-0 -translate-y-1"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-100"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0">
            <template x-if="!recentEvents.length">
                <p class="sync-event-empty">Nothing yet this session.</p>
            </template>
            <ul>
                <template x-for="item in recentEvents" :key="item.at + item.label">
                    <li>
                        <span class="sync-event-label" x-text="item.label"></span>
                        <span class="sync-event-when" x-text="eventWhen(item.at)"></span>
                    </li>
                </template>
            </ul>
        </div>
    </template>
    <template x-if="!!session && !online">
        <div class="offline-banner safe-top" x-cloak
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 -translate-y-2"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 -translate-y-2">
            <span class="sync-dot is-offline"></span>
            <span x-text="pending ? `Offline — ${pending} will send once you're back online` : 'Offline — receipts are saved on this phone'"></span>
        </div>
    </template>

    <!-- Success flash -->
    <template x-if="flash">
        <div class="hit-flash"></div>
    </template>

    <!-- ================= CAMERA GATE ================= -->
    {# Only shown where the Permissions API can tell us in advance that the camera has
       never been granted or refused. One deliberate tap opens it from here rather than
       an OS dialog appearing unprompted the moment the app launches - see the head
       script above. Sits above everything, activation included: both activation and
       scanning read the same camera. #}
    <div x-show="cameraGate" x-cloak class="fixed inset-0 z-40 flex flex-col items-center justify-center gap-4 bg-black p-8 text-center"
         x-transition.opacity.duration.200ms>
        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-white/10">
            <svg class="h-8 w-8 text-white/80" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.132.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.804-2.169a47.865 47.865 0 00-1.132-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/>
            </svg>
        </div>
        <div>
            <h1 class="text-lg font-semibold">Enable the camera to scan</h1>
            <p class="mt-1 max-w-xs text-sm text-white/60">
                One tap, once — after this it opens on its own every time you launch the app.
            </p>
        </div>
        <button type="button" class="control control-primary" @click="enableCamera()">Enable camera</button>
    </div>

    <!-- ================= ACTIVATION ================= -->
    {# fixed, not absolute: the viewfinder behind these is fixed too, and an absolute
       overlay would start resolving against any wrapper that later gains a position. #}
    <div x-show="!session" x-cloak class="fixed inset-0 flex flex-col">
        <div class="flex-1 flex items-center justify-center p-6">
            <div class="reticle" :class="{ 'is-hit': flash }"></div>
        </div>

        <div class="safe-bottom bg-black/80 px-6 pt-5 pb-6 backdrop-blur">
            <template x-if="signOutMessage">
                <p class="mb-3 rounded-lg bg-amber-500/15 px-3 py-2 text-sm text-amber-200"
                   x-text="signOutMessage"></p>
            </template>

            <template x-if="activating">
                <div class="flex items-center gap-3">
                    <span class="h-5 w-5 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
                    <h1 class="text-lg font-semibold">Activating this device…</h1>
                </div>
            </template>

            <template x-if="!activating">
                <div>
                    <h1 class="text-lg font-semibold">Activate this device</h1>
                    <p class="mt-1 text-sm text-white/70">
                        Point the camera at the activation QR code from your admin's Settings → Devices page.
                    </p>
                </div>
            </template>

            <template x-if="activationError">
                <p class="mt-3 rounded-lg bg-red-500/15 px-3 py-2 text-sm text-red-200"
                   x-text="activationError"></p>
            </template>

            {# Browsers reclaim storage - and with it, the session - from sites that only
               ever run in an ordinary tab. Installed to the Home Screen, this app is
               exempt: iOS and Android both treat it as a first-class app rather than a
               page that can be swept. Shown every time this screen is reached, not just
               on first activation, since a lost session lands back here with no other
               explanation for why it happened. #}
            <template x-if="!activating && !isStandalone">
                <p class="mt-3 rounded-lg bg-white/5 px-3 py-2 text-xs text-white/60">
                    Tip: add this app to your Home Screen (Share → Add to Home Screen).
                    Installed that way, the browser won't sign it out on its own.
                </p>
            </template>

            <div class="mt-4" x-show="showManual" x-cloak>
                <label for="manual-token" class="text-xs font-medium text-white/60">Or paste the activation link</label>
                <div class="mt-1 flex gap-2">
                    <input id="manual-token" type="text" x-model="manualToken"
                           placeholder="https://…/scan/a/…"
                           class="min-w-0 flex-1 rounded-lg border-0 bg-white/10 px-3 py-2.5 text-sm text-white placeholder:text-white/40 focus:ring-2 focus:ring-indigo-500">
                    <button type="button" class="control control-primary px-4"
                            @click="activateManually()" x-bind:disabled="activating">Go</button>
                </div>
            </div>

            <button type="button" class="mt-3 text-sm text-white/50 underline"
                    @click="showManual = !showManual"
                    x-text="showManual ? 'Hide manual entry' : 'Camera not working?'"></button>
        </div>
    </div>

    <!-- ================= SCANNING ================= -->
    <div x-show="!!session" x-cloak class="fixed inset-0 flex flex-col">

        <!-- Camera failure is the one thing that stops this screen being usable, so it
             takes over rather than sitting in a corner. -->
        <template x-if="cameraError">
            <div class="absolute inset-0 z-20 flex flex-col items-center justify-center gap-4 bg-black/90 p-8 text-center">
                <p class="text-base font-semibold">The camera could not start</p>
                <p class="max-w-xs text-sm text-white/60" x-text="cameraError"></p>
                {# enableCamera, not boot: re-running boot would build a second scanner
                   and register a second router watcher over the top of the first. What
                   "try again" means here is only "forget the cached stream or refusal
                   and ask the platform again", which is exactly what enableCamera is. #}
                <button type="button" class="control control-primary" @click="enableCamera()">Try again</button>
                <a href="{{ url_for('scan_diagnostics') }}" @click.prevent="ScanRouter.go('diagnostics')" class="text-sm text-white/50 underline">Run diagnostics</a>
            </div>
        </template>

        <!-- The decoder cannot run at all. Not a frame without a code in it - a
             scanner that will never find one, which must say so rather than look busy. -->
        <template x-if="engineError">
            <div class="absolute inset-x-4 top-16 z-20 rounded-xl bg-red-600/95 p-4 text-center">
                <p class="text-sm font-semibold">The QR reader could not start</p>
                <p class="mt-1 text-xs text-red-100" x-text="engineError"></p>
                <p class="mt-2 text-xs text-red-100">Use <strong>Photo</strong> below &mdash; we will read the receipt for you.</p>
            </div>
        </template>

        <div class="flex-1"></div>

        <!-- QR mode: a box, because only the box is read. -->
        <div class="reticle" x-show="mode === 'qr'" :class="{ 'is-hit': flash }"></div>

        {# Photo mode: the brackets sit at the edge of the picture, not inside it. What
           the viewfinder shows is what capture() saves - the whole preview, mapped back
           through `object-fit: cover` onto the sensor - so these mark that boundary
           rather than describing a second, smaller one. #}
        <div class="photo-frame" x-show="mode === 'photo'" x-cloak>
            <span></span><span></span><span></span><span></span>
        </div>

        {# ---- UPLOAD ----------------------------------------------------------

           The third mode, and the one that is not about the camera at all.

           Plenty of what an organisation spends never stands in front of a lens. A LUKU
           purchase comes back as an SMS; a receipt arrives over WhatsApp as a picture
           somebody else took; a payment confirmation is on screen right now and the only
           way to get it in here used to be to screenshot it, find the screenshot in the
           gallery, and upload that. Each of those is a real expense with real evidence
           attached, and each of them was being asked to become a photograph first.

           So: pick from the gallery, or paste - a picture on the clipboard, or the text
           itself. Text is filed as a record in its own right (input_type 'text' on the
           server), not as a note attached to nothing. #}
        <div class="upload-pane" x-show="mode === 'upload'" x-cloak
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 translate-y-2"
             x-transition:enter-end="opacity-100 translate-y-0">

            <div class="upload-actions">
                <button type="button" class="upload-tile" :disabled="importing"
                        @click="$refs.gallery.click()">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/>
                    </svg>
                    <span>From gallery</span>
                </button>

                {# Reads the clipboard directly where the browser allows it, which is
                   most Android browsers and, for text, Safari behind its own paste
                   prompt. Where it does not, this falls back to focusing the box below
                   and saying so - never to a dead button, because a person holding a
                   copied SMS has no other move to try. #}
                <button type="button" class="upload-tile" :disabled="importing"
                        @click="pasteFromClipboard()">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184"/>
                    </svg>
                    <span>Paste</span>
                </button>
            </div>

            <label for="paste-text" class="upload-label">Or type the reference itself</label>
            {# Five rows, because a LUKU SMS is five lines - meter, token, units, amount
               and the word LUKU itself - and a box that cuts the amount off is a box
               nobody can check their paste in. #}
            <textarea id="paste-text" x-ref="pasteBox" x-model="pastedText" rows="5"
                      :maxlength="textMaxChars"
                      placeholder="e.g. the LUKU SMS: token, units, meter number and amount"
                      class="upload-textarea"></textarea>

            <div class="upload-foot">
                <span class="text-xs text-white/40"
                      x-text="pastedText.length ? `${pastedText.length} / ${textMaxChars}` : 'Electricity, water, mobile money — anything with no receipt behind it.'"></span>
                <button type="button" class="control control-primary upload-save"
                        @click="saveText()" :disabled="!pastedText.trim()">Save record</button>
            </div>

            <template x-if="pasteHint">
                <p class="mt-2 text-xs text-amber-300" x-text="pasteHint"></p>
            </template>
        </div>

        <div class="flex-1"></div>

        <!-- Hint. What just got saved is the confirmation sheet's job now, not this
             line's - see CONFIRM below. -->
        <div class="px-6 pb-3 text-center">
            <template x-if="mode === 'photo'">
                <p class="text-sm text-white/70">
                    Everything you can see is saved. Fill the screen with the receipt.
                </p>
            </template>
            <template x-if="mode === 'qr' && struggling">
                <button type="button" @click="setMode('photo')"
                        class="animate-pulse text-sm font-semibold text-amber-300 underline">
                    Can't read it? Take a photo instead
                </button>
            </template>
            <template x-if="mode === 'qr' && !struggling">
                <p class="text-sm text-white/60">Point at the QR code on the receipt</p>
            </template>
            <template x-if="foreignCode">
                <p class="mt-1 text-xs text-red-300">That isn't a TRA receipt code.</p>
            </template>
            <template x-if="importing">
                <p class="mt-1 text-xs text-white/70" x-text="importProgress"></p>
            </template>
            <template x-if="importError">
                <p class="mt-1 text-xs text-red-300" x-text="importError"></p>
            </template>
        </div>

        {# Mode switch. Photo first and Photo by default: it is the one that always
           works. Scanning a QR code is faster when it lands, but it is the mode that
           fails on a creased receipt, in bad light, on a fading thermal print - and a
           default that sometimes cannot do the job is a default that teaches people the
           app is unreliable. A photograph is never refused, and the server reads the
           code off it afterwards anyway. #}
        <div class="flex justify-center pb-3">
            <div class="mode-switch">
                <button type="button" :class="{ 'is-active': mode === 'photo' }" @click="setMode('photo')">Photo</button>
                <button type="button" :class="{ 'is-active': mode === 'qr' }" @click="setMode('qr')">Scan QR</button>
                <button type="button" :class="{ 'is-active': mode === 'upload' }" @click="setMode('upload')">Upload</button>
            </div>
        </div>

        {# Controls.

           A three-column grid rather than a flex row with space-between, and that is the
           whole of the fix for the shutter: in a flex row the button sat wherever the
           widths on either side of it happened to leave it, so it moved when the torch
           appeared and it was never actually in the middle of the screen. Each column
           here is a third of the width, so the middle one's centre is the screen's
           centre - permanently, whatever is beside it. #}
        <div class="safe-bottom grid grid-cols-3 items-center px-5 pb-5">

            {# History, promoted from an unlabelled circle to the second real button on
               this screen. It is where a person checks that what they scanned actually
               went - the question the whole app exists to answer - and it had been
               reduced to a clock glyph indistinguishable from the gallery icon next to
               it. The badge is the outbox: a number here is the only thing on the camera
               screen that says receipts are still sitting on this phone. #}
            <a href="{{ url_for('scan_history') }}" @click.prevent="ScanRouter.go('history')"
               class="dash-link justify-self-start" aria-label="My receipts">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12"/>
                </svg>
                <span>Receipts</span>
                <template x-if="pending > 0">
                    <span class="dash-link-badge" x-text="pending > 99 ? '99+' : pending"></span>
                </template>
            </a>

            {# Receipts that were photographed before this app was involved - by a
               colleague, on a phone that was offline for a week, or simply days ago -
               are the same receipts. `multiple` because that backlog is never one
               photo, and no `capture` attribute because that is precisely what tells a
               phone to open the camera instead of the library.

               The button that opens it lives in the Upload pane now; the input itself
               stays here, unattached to any layout, because it is only ever click()ed. #}
            <input type="file" x-ref="gallery" accept="image/*" multiple class="hidden"
                   @change="importFromGallery($event)">

            <div class="justify-self-center">
                <button type="button" class="shutter" x-show="mode === 'photo'"
                        @click="takePhoto()" :disabled="capturing" aria-label="Take photo"></button>

                <!-- In QR mode scanning is automatic, so a shutter would invite pointless
                     taps; the slot keeps the row from shifting when modes change. -->
                <div x-show="mode === 'qr'" class="flex h-[4.5rem] w-[4.5rem] items-center justify-center">
                    <span class="h-2.5 w-2.5 animate-pulse rounded-full bg-white/70"></span>
                </div>

                <!-- Upload mode's primary action, in the position the thumb is already
                     resting on. Pasting is the point of this mode; the tile above is the
                     same call for anyone who reached the pane a different way. -->
                <button type="button" class="shutter shutter-action" x-show="mode === 'upload'" x-cloak
                        @click="pasteFromClipboard()" :disabled="importing" aria-label="Paste from the clipboard">
                    <template x-if="!importing">
                        <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184"/>
                        </svg>
                    </template>
                    <template x-if="importing">
                        <span class="h-6 w-6 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
                    </template>
                </button>
            </div>

            {# Torch.

               The icon it replaces was Heroicons' eye-slash - a crossed-out eye, which
               on a camera screen reads as "hide the preview" or "privacy", and which is
               the same crossed-out shape whether the light is on or off. It was the one
               control on here that nobody could name.

               A bolt is the phone-camera convention for this and nothing else, and the
               two states are now genuinely two icons: struck through for off, plain and
               filled for on, on top of the amber the button already turned. #}
            <button type="button" class="control control-round justify-self-end"
                    :class="{ 'is-on': torchOn }"
                    x-show="torchAvailable" @click="toggleTorch()"
                    :aria-pressed="torchOn ? 'true' : 'false'"
                    :aria-label="torchOn ? 'Turn the light off' : 'Turn the light on'">
                <template x-if="torchOn">
                    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z"/>
                    </svg>
                </template>
                <template x-if="!torchOn">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.412 15.655L9.75 21.75l3.745-4.012M9.257 13.5H3.75l2.659-2.849m2.048-2.194L14.25 2.25 12 10.5h8.25l-4.707 5.043M8.457 8.457L3 3m5.457 5.457l7.086 7.086m0 0L21 21"/>
                    </svg>
                </template>
            </button>
            <div x-show="!torchAvailable" class="h-13 w-13 justify-self-end"></div>
        </div>

        <!-- ================= CONFIRM ================= -->
        {# The point of this screen: the camera does not go back to looking the moment
           a code decodes. It waits, on purpose, for a tap - which is the only thing
           that stops the same receipt, still sitting in frame, being read and queued
           again on the very next one. The wait doubles as where a note gets attached,
           since asking after the fact means asking never happens. #}
        <div x-show="!!confirming" x-cloak class="fixed inset-0 z-30 flex flex-col justify-end"
             x-transition.opacity.duration.200ms>
            <button type="button" class="flex-1 bg-black/70" @click="continueScanning()"
                    aria-label="Continue scanning" :disabled="submitting"></button>

            <div class="confirm-sheet safe-bottom rounded-t-3xl bg-zinc-950 px-6 pt-5 pb-8 shadow-2xl"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="translate-y-full"
                 x-transition:enter-end="translate-y-0"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="translate-y-0"
                 x-transition:leave-end="translate-y-full">
                <div class="mx-auto mb-4 h-1.5 w-12 rounded-full bg-white/25"></div>

                <template x-if="confirming && confirming.kind !== 'batch' && confirming.previewUrl">
                    <img :src="confirming.previewUrl" alt="" class="mb-4 max-h-64 w-full rounded-xl object-cover">
                </template>

                {# A pasted record gets the same look-before-you-send treatment a photo
                   does, and needs it more: the clipboard is the one source here whose
                   contents nobody has actually seen at the moment they submit it. Shown
                   as it was pasted - line breaks intact - because that is how a LUKU
                   SMS is read, and because a wrong paste is only obvious in its own
                   shape. #}
                <template x-if="confirming && confirming.kind === 'text'">
                    <pre class="mb-4 max-h-48 overflow-auto whitespace-pre-wrap break-words rounded-xl bg-white/5 p-3 font-mono text-xs leading-relaxed text-white/80"
                         x-text="confirming.text"></pre>
                </template>

                {# A batch is shown as the strip it is, so an accidental extra photo -
                   the screenshot, the picture of the car - is caught here rather than
                   after it has been queued. #}
                <template x-if="confirming && confirming.kind === 'batch'">
                    <ul class="mb-4 flex gap-2 overflow-x-auto pb-1">
                        <template x-for="(item, index) in confirming.items" :key="index">
                            <li class="relative h-20 w-16 flex-none overflow-hidden rounded-lg bg-white/10">
                                <template x-if="item.previewUrl">
                                    <img :src="item.previewUrl" alt="" class="h-full w-full object-cover">
                                </template>
                                <template x-if="!item.previewUrl">
                                    <span class="flex h-full w-full items-center justify-center text-2xl">🧾</span>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>

                <div class="flex items-center gap-3">
                    <span class="flex h-10 w-10 flex-none items-center justify-center rounded-full bg-green-500/20 text-lg text-green-400">✓</span>
                    <div class="min-w-0">
                        <p class="text-base font-semibold text-white"
                           x-text="confirming && confirming.kind === 'batch'
                                   ? `${confirming.items.length} receipts saved on this phone`
                                   : (confirming && confirming.kind === 'text'
                                      ? 'Record saved on this phone'
                                      : 'Receipt saved on this phone')"></p>
                        <p class="truncate font-mono text-sm text-white/60" x-text="confirming && confirming.label"></p>
                    </div>
                </div>

                {# One note for the whole batch. Asking per photo is how a note stops
                   being attached to any of them. #}
                <template x-if="confirming && confirming.kind === 'batch'">
                    <p class="mt-3 text-xs text-white/40">
                        <span x-text="confirming.verified"></span> read straight off their QR codes;
                        the rest are read on the server after they upload.
                    </p>
                </template>

                <label for="confirm-note" class="mt-5 block text-sm font-medium text-white/60">Note (optional)</label>
                <textarea id="confirm-note" x-model="noteText" rows="3" maxlength="200"
                          placeholder="e.g. Mayai x 6 - fuel for the van - client lunch"
                          class="mt-1.5 w-full resize-none rounded-xl border-0 bg-white/10 px-3.5 py-3 text-base text-white placeholder:text-white/30 focus:ring-2 focus:ring-indigo-500"></textarea>
                {# The placeholder now leads with a count, and this line says why. A mobile
                   money record names the person paid and nothing else, so what is typed
                   here is the only description of the purchase that will ever exist - and
                   it is read for the goods, not just for the category. Whatever language
                   or spelling it arrives in, it is filed under the same product as the
                   last time the same thing was bought. #}
                <p class="mt-1.5 text-xs text-white/40">
                    Naming what was bought and how many &mdash; &lsquo;Mayai x 6&rsquo; &mdash; is enough.
                    Swahili or English, either way it files under the same product.
                </p>

                <template x-if="confirmError">
                    <p class="mt-3 rounded-lg bg-red-500/15 px-3 py-2 text-sm text-red-200">
                        <span x-text="confirmError"></span>
                        <a href="{{ url_for('scan_diagnostics') }}" @click.prevent="ScanRouter.go('diagnostics')" class="ml-1 whitespace-nowrap underline">Diagnostics</a>
                    </p>
                </template>

                <button type="button" class="control control-primary mt-4 w-full disabled:opacity-60"
                        @click="continueScanning()" :disabled="submitting">
                    <span x-text="submitting ? 'Saving…'
                                  : (confirming && confirming.kind === 'batch'
                                     ? `Submit ${confirming.items.length} receipts`
                                     : (confirming && confirming.kind === 'text'
                                        ? 'Submit record' : 'Submit receipt'))"></span>
                </button>
                <button type="button" class="mt-2 w-full py-1 text-center text-xs text-white/40 underline"
                        @click="discardConfirming()"
                        x-text="confirming && confirming.kind === 'text'
                                ? 'Wrong text? Discard it' : 'Wrong receipt? Discard it'"></button>
            </div>
        </div>
    </div>
</div>

<script>
function scannerApp() {
    return {
        session: null,
        scanner: null,
        /*
         * Which of the three ways in is showing.
         *
         * 'photo' captures the whole frame; 'qr' reads a small box and is the only mode
         * that runs the decoder at all; 'upload' is not a camera mode - it is the
         * gallery and the clipboard, for evidence that never passes in front of a lens.
         * Each shows a different guide because each captures a different thing: a QR box
         * drawn over a full-frame photo tells the user to fit a receipt inside a crop
         * that is never applied.
         *
         * Photo is the default. See the note on the mode switch above for why.
         */
        mode: 'photo',
        // The paste box's contents, and the one-line explanation shown when the browser
        // will not hand over the clipboard by itself.
        pastedText: '',
        pasteHint: null,
        textMaxChars: (window.PWA && window.PWA.TEXT_MAX_CHARS) || 1000,
        cameraError: null,
        cameraGate: false,
        engineError: null,
        torchAvailable: false,
        torchOn: false,
        struggling: false,
        capturing: false,
        importing: false,
        importError: null,
        importProgress: '',
        flash: false,
        confirming: null,
        submitting: false,
        confirmError: null,
        noteText: '',
        foreignCode: false,
        // null means storage did not answer, which is not the same as zero - see the
        // note on status() in pwa.js.
        pending: null,
        storageOk: true,
        syncing: false,
        online: navigator.onLine !== false,
        signOutMessage: null,
        activationError: null,
        activating: false,
        showManual: false,
        manualToken: '',
        islandExpanded: false,
        recentEvents: [],
        _islandTimer: null,
        // Whether this view is the one on screen. Owned by ScanRouter - see setActive().
        active: false,
        // The promise for the one and only camera open this view performs.
        _camera: null,
        _releaseTimer: null,
        // How long the scan view can sit unwatched before the camera is handed back to
        // the OS. Long enough to cover glancing at history and returning, short enough
        // that leaving the app parked on another view does not hold the camera - and
        // its indicator light - open indefinitely.
        cameraIdleReleaseMs: 45000,
        isStandalone: window.navigator.standalone === true
            || window.matchMedia('(display-mode: standalone)').matches,

        /*
         * Nothing on this screen is allowed to queue in front of the camera.
         *
         * This used to read `await this.refresh(); await this.claimTokenFromUrl();`
         * before it so much as constructed the scanner - so the viewfinder stayed black
         * behind an IndexedDB round trip and, when the launcher icon carried an
         * activation token, behind a network POST with a 45-second budget. On a cold
         * launch on a bad connection that is most of a minute of black screen while the
         * camera was, in fact, already open and streaming: the head script had it ready
         * the whole time and nothing had picked it up.
         *
         * The camera is what someone is looking at, so it goes first and the rest -
         * storage, session, activation - catches up around it. None of them are things
         * the viewfinder needs, and handleResult already copes with a scan arriving
         * before the session has loaded by ignoring it.
         */
        async boot() {
            this.cameraError = null;
            this.scanner = Scanner.create(this.$refs.video, {
                onResult: (text) => this.handleResult(text),
                onStruggling: () => { this.struggling = true; },
                onEngineFailure: (e) => {
                    this.engineError = e.message;
                    // Nothing can be scanned, so put the user where they can still work.
                    this.setMode('photo');
                },
            });
            // Published for the diagnostics screen, which is a different Alpine
            // component in the same document and has to be able to change the camera on
            // the one stream that exists. Reaching into another component's state would
            // be worse; a second scanner over a second stream is not possible on the
            // phones this runs on.
            window.__scanner = this.scanner;

            // Coming back from a call, a lock screen or another app frequently means
            // coming back to a camera the OS has taken - see Scanner.revive().
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && this.active) this.reviveCamera();
            });

            /*
             * A paste anywhere on this screen, not only into the box.
             *
             * On a laptop or a tablet with a keyboard, Ctrl/Cmd-V is what somebody
             * holding a copied payment SMS or a screenshot will try first, and having
             * that do nothing unless they had already found the Upload tab and tapped
             * into a textarea is a feature that exists but cannot be found. This routes
             * the paste to the right place instead: a picture is imported, text opens
             * Upload with the text already in it.
             *
             * Pastes aimed at a real field are left alone - see handlePaste.
             */
            document.addEventListener('paste', (event) => this.handlePaste(event));

            ScanRouter.watch('scan', (active) => this.setActive(active));

            PWA.start();
            PWA.onChange(() => this.refresh());
            await this.refresh();
            await this.claimTokenFromUrl();
            await this._camera;
        },

        /*
         * Entering and leaving the scan view, without ever losing the camera.
         *
         * The stream is not torn down on the way out - that is the whole reason these
         * three screens share a document - but the decode loop is stopped dead, since
         * ZXing on every frame is the app's largest ongoing cost and nothing is looking
         * at the viewfinder.
         *
         * Holding an open camera indefinitely while someone reads their history is its
         * own problem though: it is a lit privacy indicator and a real battery draw for
         * a screen that is not using it. So a long absence releases it, and coming back
         * reopens it through the same path a backgrounded phone already uses. Within
         * one document that reopen is silent - the permission was granted to this
         * document and it still holds it - which is exactly what a full navigation
         * could not promise.
         */
        setActive(active) {
            this.active = active;
            clearTimeout(this._releaseTimer);

            if (!active) {
                if (this.scanner) this.scanner.pause();
                this._releaseTimer = setTimeout(() => {
                    if (!this.active && this.scanner) this.scanner.release();
                }, this.cameraIdleReleaseMs);
                return;
            }

            // First entry: the camera has not been opened yet. Later entries: it has,
            // and only needs waking.
            if (!this._camera) this._camera = this.startCamera();
            else this.resumeCamera();
        },

        async resumeCamera() {
            await this.reviveCamera();
            // syncDecoder rather than a bare resume: the sheet being up is one of
            // several reasons not to be decoding, and Photo mode is now another.
            this.syncDecoder();
        },

        async reviveCamera() {
            if (!this.scanner || this.cameraGate) return;
            try {
                if (await this.scanner.revive()) {
                    this.cameraError = null;
                    this.torchAvailable = this.scanner.torchAvailable;
                    this.torchOn = false;   // The new track starts with its light off.
                }
            } catch (e) {
                this.cameraError = (e && e.message) || 'The camera stopped. Reopen the app.';
            }
        },

        async startCamera() {
            // Resolved, not read: see the note on __cameraNeedsGate in <head>.
            if (await window.__cameraNeedsGate) {
                // Permission has never been decided and the platform told us so in
                // advance. Wait for the tap in the gate pane instead of surprising
                // whoever just opened the icon - see enableCamera().
                this.cameraGate = true;
                return;
            }
            await this.openCamera();
        },

        async openCamera() {
            this.cameraGate = false;
            // A fresh attempt clears the last failure; leaving it up behind a working
            // viewfinder is how "Try again" looked like it had done nothing.
            this.cameraError = null;
            try {
                await this.scanner.start();
                // start() begins decoding unconditionally. Whether it should still be
                // decoding a moment later depends on the mode and on whether this
                // device is activated yet, which is what syncDecoder knows.
                this.syncDecoder();
                this.torchAvailable = this.scanner.torchAvailable;
                // Started here rather than at PWA.start(): geolocation is its own
                // permission prompt, and stacking it on top of the camera one at the
                // very first instant of a cold launch is exactly the pile-up of
                // prompts this app is trying to avoid. The camera is what someone is
                // looking at; by the time they have it framed on a receipt, this fix
                // has had time to resolve.
                PWA.watchLocation();
            } catch (e) {
                this.cameraError = e && e.name === 'NotAllowedError'
                    ? 'Camera permission was refused. Allow it in your browser settings, then try again.'
                    : (e && e.message) || 'Unknown error.';
            }
        },

        /*
         * The tap that is allowed to open the OS permission dialog, and equally the
         * "Try again" on a camera that failed. Both mean the same thing: forget
         * whatever stream or refusal is cached and ask the platform again from scratch.
         */
        async enableCamera() {
            window.__cameraPromise = null;
            this._camera = this.openCamera();
            await this._camera;
        },

        /*
         * Activates from the token the launcher icon carries, if there is one.
         *
         * This is what makes "Add to Home Screen" enough on its own: the manifest's
         * start_url carries the activation token, so the installed app opens already
         * holding it and spends it here - in the storage the app actually runs in,
         * which on iOS is not the one Safari uses.
         *
         * Every subsequent launch carries the same spent token, because start_url is
         * fixed at install time. So a session always wins, and a token that no longer
         * works is not an error worth showing - it is just an old shortcut.
         */
        async claimTokenFromUrl() {
            const token = new URLSearchParams(location.search).get('t');
            if (!token) return;

            if (!this.session) {
                this.activating = true;
                const result = await PWA.activate(token);
                this.activating = false;
                if (result.ok) {
                    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
                    await this.refresh();
                } else if (result.reason !== 'unknown') {
                    // A real problem - offline, revoked, timed out - is worth saying.
                    this.activationError = result.error;
                }
            }

            // Cleaned either way, so a reload does not retry a token that is spent and
            // the address bar does not carry a credential around. Through the router
            // rather than history.replaceState directly: a bare replaceState blanks the
            // {view} the router stamped on this entry, and replacing rather than pushing
            // is the point - a back button that returns to a spent credential is not a
            // history entry anyone wants.
            ScanRouter.go('scan', { replace: true, keepScroll: true });
        },

        async refresh() {
            const status = await PWA.status();
            this.session = status.session;
            this.pending = status.pending;
            this.syncing = status.syncing;
            this.online = status.online;
            this.storageOk = status.storageOk;
            this.signOutMessage = status.signOutReason ? status.signOutReason.message : null;
            this.recentEvents = status.recentEvents;
            // Activation reads a QR code whatever the mode switch says, so a session
            // appearing - or being lost - is exactly when the decoder should be
            // reconsidered. See the `decoding` getter.
            this.syncDecoder();
        },

        /*
         * One decode, two possible meanings.
         *
         * The same camera loop serves activation and scanning, so what a decoded string
         * means depends on whether this device has a session yet. Returning false tells
         * the scanner to ignore it and keep looking, which is what should happen when a
         * poster or a product barcode wanders into shot.
         */
        handleResult(text) {
            const activationToken = PWA.activationTokenFrom(text);
            if (activationToken) {
                if (!this.session) { this.activate(activationToken); return true; }
                return false;   // Already activated; a stray activation QR is not for us.
            }

            if (!this.session) return false;
            if (this.confirming) return false;   // Already holding one; do not stack a second.

            const receipt = Scanner.parseReceipt(text);
            if (!receipt) {
                this.foreignCode = true;
                setTimeout(() => { this.foreignCode = false; }, 2000);
                return false;
            }

            this.foreignCode = false;
            this.confirm({ kind: 'qr', receipt, label: receipt.code });
            return true;
        },

        /*
         * Holds a decoded receipt for a beat rather than queuing it straight away.
         *
         * The camera keeps decoding every frame it is pointed at, and a receipt that
         * was just read is still sitting dead center in that frame - without this, the
         * very next frame reads the same code again and queues a second copy of the
         * same receipt before anyone has moved the phone. Pausing the scanner here is
         * what actually stops that; the sheet it shows is what turns the pause into
         * something useful, by giving whoever is scanning a moment to attach a note.
         */
        confirm(item) {
            if (this.scanner) this.scanner.pause();
            this.noteText = '';
            this.confirming = item;
            this.confirmError = null;
            this.struggling = false;
            if (navigator.vibrate) navigator.vibrate(60);
            this.flash = true;
            setTimeout(() => { this.flash = false; }, 500);
        },

        /*
         * Guarded against two failure modes that used to leave the sheet stuck open
         * forever with a button that looked dead: a rejection from PWA.queueScan (rare,
         * but real - see getDB's WebKit note in pwa.js) previously propagated out of
         * this handler uncaught, so dismissConfirm() never ran and the scanner stayed
         * paused. `submitting` additionally stops a slow save from being fired twice by
         * an impatient second tap, which used to be able to queue the same receipt
         * again under a second uuid.
         */
        async continueScanning() {
            const item = this.confirming;
            if (!item || this.submitting) return;
            this.submitting = true;
            this.confirmError = null;
            const note = this.noteText.trim();

            try {
                var queue = item.kind === 'batch' ? item.items : [item];
                for (var i = 0; i < queue.length; i++) {
                    await this.queueOne(queue[i], note);
                }

                this.dismissConfirm();
                await this.refresh();
            } catch (e) {
                // Clears the short back-off getDB() applies after a failure, so that
                // tapping the button again is a real retry - which now includes
                // rebuilding a database whose stores went missing - rather than a
                // second helping of the same cached rejection.
                PWA.resetStorage();
                this.confirmError = 'Could not save this receipt on the phone. '
                    + ((e && e.message) || 'Unknown error.') + ' Tap Submit again to retry.';
                await this.refresh();
            } finally {
                this.submitting = false;
            }
        },

        /*
         * One item onto the outbox.
         *
         * Location is attached only to something photographed here and now. A gallery
         * import carries `capturedAt` from the file instead, and stamping it with where
         * the phone is standing when it was imported would put a Mwanza fuel stop in
         * Dar es Salaam - a wrong answer is worse than no answer on a field that exists
         * to corroborate a receipt.
         *
         * A pasted record is excluded by the same rule and not by accident. The LUKU
         * token in somebody's messages was bought at a meter that is not here, at a
         * time that is not now; where the phone happens to be when it was pasted
         * corroborates nothing at all.
         */
        queueOne(item, note) {
            var here = !item.capturedAt && item.kind !== 'text';
            var fields = {
                description: note || null,
                location: here ? PWA.currentLocation() : null,
                captured_at: item.capturedAt || null,
            };
            // Not either/or any more. A scan whose code decoded carries both: the URL
            // is what the receipt is verified from, the photograph is the paper it was
            // read off, and the server files them as one submission.
            if (item.receipt) fields.receipturl = item.receipt.raw;
            if (item.blob) fields.photo = item.blob;
            if (item.text) fields.text = item.text;
            return PWA.queueScan(fields);
        },

        /* A mis-scan - the wrong receipt, someone else's - without a way back out of
           this sheet would just teach people to stop checking. */
        discardConfirming() {
            this.dismissConfirm();
        },

        dismissConfirm() {
            if (this.confirming && this.confirming.previewUrl) URL.revokeObjectURL(this.confirming.previewUrl);
            // A batch holds one object URL per thumbnail, and leaking twenty of them per
            // import is a real amount of memory on the phone this runs on.
            if (this.confirming && this.confirming.items) {
                this.confirming.items.forEach(function (item) {
                    if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
                });
            }
            this.confirming = null;
            this.noteText = '';
            this.confirmError = null;
            this.syncDecoder();
        },

        async takePhoto() {
            if (!this.scanner || this.capturing) return;
            this.capturing = true;
            try {
                /*
                 * `decode: false`, because this button is Photo and Photo means photo.
                 *
                 * A still used to be run through all three decoders on the way past, and
                 * a hit turned the capture into a verified TRA scan labelled with a
                 * receipt code. Better data, and the wrong behaviour: somebody who has
                 * just chosen Photo over Scan QR is told the app read a QR code anyway.
                 *
                 * The receipt still gets verified. The photograph goes up at the larger
                 * of the two upload sizes and utils/qr.py decodes it server-side with a
                 * ladder this phone cannot match - contrast stretching, overlapping
                 * tiles, each one tripled - and from there it takes the ordinary
                 * verified path. The reading moved; it did not disappear.
                 */
                const shot = await this.scanner.capture({ decode: false });

                const previewUrl = URL.createObjectURL(shot.blob);
                this.confirm({ kind: 'photo', blob: shot.blob, previewUrl, label: 'Photo' });
            } catch (e) {
                this.cameraError = (e && e.message) || 'Could not take a photo.';
            } finally {
                this.capturing = false;
            }
        },

        /*
         * Receipts that were photographed before this app got involved.
         *
         * The camera is the fast path, not the only one: a backlog builds up in a
         * phone's gallery - photos taken before the app was installed, receipts sent in
         * by a colleague, a week in the field where nobody had time to open anything.
         * Making people re-photograph a photograph to get it in here is how a backlog
         * stays a backlog.
         *
         * Each picked file goes through the same decoders a live frame does, so an
         * image whose QR code reads is queued as a verified TRA scan and not as a
         * picture. What does not read is queued as a photo, which the server now takes
         * considerably further than it used to - it decodes the QR again at full size,
         * and failing that reads the verification code off the paper (see
         * _receipt_from_photo in main.py). So "not decoded here" is no longer the end
         * of the road it once was, which is why a stubborn image is worth queuing
         * rather than refusing.
         */
        async importFromGallery(event) {
            var files = Array.from(event.target.files || []);
            // Cleared immediately so picking the very same file again still fires a
            // change event - otherwise a retry after an error appears to do nothing.
            event.target.value = '';
            await this.importFiles(files);
        },

        /*
         * The same read, for files from anywhere.
         *
         * Split out of importFromGallery when the clipboard became a second source of
         * pictures. A screenshot on the clipboard and a photo in the gallery are the
         * same thing arriving by different doors, and neither of them is worth a second
         * copy of the decode-count-confirm loop below.
         */
        async importFiles(files) {
            files = Array.from(files || []);
            if (!files.length || this.importing) return;

            this.importing = true;
            this.importError = null;
            this.discardConfirming();

            var items = [];
            var failed = 0;
            try {
                for (var i = 0; i < files.length; i++) {
                    var file = files[i];
                    this.importProgress = files.length > 1
                        ? `Reading ${i + 1} of ${files.length}…` : 'Reading the photo…';
                    if (file.type && file.type.indexOf('image/') !== 0) continue;

                    try {
                        var shot = await Scanner.readImageFile(file);
                    } catch (e) {
                        // One unreadable file out of twenty must not cost the other
                        // nineteen. It is counted and reported at the end instead.
                        failed += 1;
                        continue;
                    }

                    // Both halves are kept whichever way the decode went - see
                    // takePhoto() for why a read code is not a reason to drop the
                    // picture it was read from.
                    var receipt = shot.text ? Scanner.parseReceipt(shot.text) : null;
                    items.push({
                        kind: receipt ? 'qr' : 'photo',
                        receipt: receipt,
                        blob: shot.blob,
                        previewUrl: URL.createObjectURL(shot.blob),
                        label: receipt ? receipt.code : (file.name || 'Photo'),
                        capturedAt: this.takenAt(file),
                    });
                }
            } finally {
                this.importing = false;
                this.importProgress = '';
            }

            if (!items.length) {
                this.importError = 'None of those files could be read as a photo.';
                return;
            }
            if (failed) {
                this.importError = `${failed} file(s) could not be read and were skipped.`;
            }

            if (items.length === 1) {
                this.confirm(items[0]);
                return;
            }

            this.confirm({
                kind: 'batch',
                items: items,
                verified: items.filter(function (item) { return item.kind === 'qr'; }).length,
                label: `${items.length} photos from the gallery`,
            });
        },

        /*
         * The clipboard, asked for directly.
         *
         * Two shapes come off it and both are wanted. A screenshot of a payment
         * confirmation is a picture and goes through the same decode-and-queue path a
         * gallery photo does. An SMS someone copied is text, and becomes a record in its
         * own right - which is the whole reason this exists, because the alternative
         * being practised in the field is to screenshot the text, save the screenshot,
         * and upload a photograph of words we could have had exactly.
         *
         * Images are tried before text on purpose: a copied image often carries a text
         * flavour alongside it (a filename, a URL), and filing that string as the
         * expense record instead of the picture would be a quiet, wrong answer.
         *
         * Permission is not assumed anywhere. `clipboard.read` does not exist on some
         * browsers and is refused on others, and Safari puts its own paste confirmation
         * in front of both - so every failure ends at the same place: the box, focused,
         * with one line saying to use the keyboard's own paste. Never a dead button.
         */
        async pasteFromClipboard() {
            this.pasteHint = null;
            this.importError = null;

            if (navigator.clipboard && navigator.clipboard.read) {
                try {
                    var items = await navigator.clipboard.read();
                    var files = [];
                    for (var i = 0; i < items.length; i++) {
                        var type = (items[i].types || []).find(function (t) {
                            return t.indexOf('image/') === 0;
                        });
                        if (!type) continue;
                        var blob = await items[i].getType(type);
                        files.push(new File([blob], 'pasted-' + (files.length + 1) + '.png',
                                            { type: blob.type || 'image/png' }));
                    }
                    if (files.length) {
                        await this.importFiles(files);
                        return;
                    }
                } catch (e) { /* no image, or no permission; text is still worth a try */ }
            }

            if (navigator.clipboard && navigator.clipboard.readText) {
                try {
                    var text = await navigator.clipboard.readText();
                    if (text && text.trim()) {
                        this.acceptPastedText(text);
                        return;
                    }
                } catch (e) { /* falls through to the manual instruction below */ }
            }

            this.setMode('upload');
            this.pasteHint = 'This browser won\u2019t hand over the clipboard on its own. '
                + 'Tap the box below, then long-press and choose Paste.';
            this.focusPasteBox();
        },

        /*
         * A paste event that was not aimed at a text field.
         *
         * Left strictly alone when it was: a person pasting into the box below, or into
         * the note on the confirmation sheet, or into the manual activation field means
         * that field and nothing else, and hijacking it would make those fields
         * unusable - which is a far worse bug than the convenience this adds.
         */
        handlePaste(event) {
            if (!this.active || !this.session) return;

            var target = event.target;
            var tag = target && target.tagName;
            if (tag === 'TEXTAREA' || tag === 'INPUT' || (target && target.isContentEditable)) return;

            var data = event.clipboardData;
            if (!data) return;

            var files = Array.from(data.files || []).filter(function (file) {
                return file.type && file.type.indexOf('image/') === 0;
            });
            if (files.length) {
                event.preventDefault();
                this.importFiles(files);
                return;
            }

            var text = data.getData ? data.getData('text/plain') : '';
            if (text && text.trim()) {
                event.preventDefault();
                this.acceptPastedText(text);
            }
        },

        /*
         * Pasted text, sorted into the two things it can be.
         *
         * A TRA verification link is a receipt - the strongest kind this app handles,
         * because the portal will answer for it - so it skips the box entirely and goes
         * straight to the confirmation sheet as an ordinary scan. Copying the link out
         * of a vendor's SMS is a perfectly good way to submit a receipt and there is no
         * reason to make somebody photograph a screen showing it.
         *
         * Anything else is the record itself, and goes into the box to be looked at
         * before it is sent. Not straight to the sheet: unlike a URL there is nothing
         * here to validate against, so the only check available is a person reading it.
         */
        acceptPastedText(text) {
            var trimmed = (text || '').trim();
            if (!trimmed) return;

            var receipt = Scanner.parseReceipt(trimmed);
            if (receipt) {
                this.confirm({ kind: 'qr', receipt: receipt, label: receipt.code });
                return;
            }

            this.setMode('upload');
            this.pastedText = trimmed.slice(0, this.textMaxChars);
            this.pasteHint = null;
            this.focusPasteBox();
        },

        /* Queues what is in the box. Re-checks for a TRA link because the text may have
           been typed or pasted straight into the field, which never went past
           acceptPastedText. */
        saveText() {
            var text = this.pastedText.trim();
            if (!text) return;

            var receipt = Scanner.parseReceipt(text);
            if (receipt) {
                this.pastedText = '';
                this.confirm({ kind: 'qr', receipt: receipt, label: receipt.code });
                return;
            }

            var record = text.slice(0, this.textMaxChars);
            this.pastedText = '';
            this.confirm({ kind: 'text', text: record, label: this.firstLine(record) });
        },

        /* What a pasted record is called in a list: its own first line, which for every
           real example - a LUKU token, an M-Pesa confirmation - is the line that says
           what it is. */
        firstLine(text) {
            var lines = (text || '').split('\n');
            var line = '';
            for (var i = 0; i < lines.length; i++) {
                if (lines[i].trim()) { line = lines[i].trim(); break; }
            }
            if (!line) return 'Pasted record';
            return line.length > 48 ? line.slice(0, 48) + '\u2026' : line;
        },

        focusPasteBox() {
            this.$nextTick(() => {
                if (this.$refs.pasteBox) this.$refs.pasteBox.focus();
            });
        },

        /*
         * When the picture was taken, as far as the file knows.
         *
         * An imported receipt is not a receipt scanned today, and dating it today puts
         * a March expense in whatever month somebody got round to uploading it. The
         * file's own timestamp is the best available answer without parsing EXIF; it is
         * accurate for a photo taken on this phone, and no worse than 'now' for one
         * that arrived over WhatsApp.
         */
        takenAt(file) {
            var stamp = file && file.lastModified;
            if (!stamp || stamp > Date.now()) return null;
            try {
                return new Date(stamp).toISOString();
            } catch (e) {
                return null;
            }
        },

        /*
         * Switching modes changes what is framed *and* what is decoded.
         *
         * It used to change only the first: the decode loop ran in every mode on the
         * reasoning that a free verified receipt is better than a picture of one. What
         * that felt like in the hand was the app refusing to take the photograph you
         * asked for - line up a receipt in Photo, and the confirmation sheet fires on
         * its QR code before the shutter has been touched, holding a scan nobody
         * requested. Only Scan QR looks for codes now, and the server reads the code off
         * the photograph afterwards regardless (see takePhoto).
         *
         * Upload has no viewfinder behaviour at all, so it decodes nothing either.
         */
        setMode(mode) {
            this.mode = mode;
            this.struggling = false;
            this.importError = null;
            if (mode !== 'upload') this.pasteHint = null;
            this.syncDecoder();
        },

        /*
         * Whether the QR decoder should be running right now.
         *
         * Every reason not to be, in one place, because they arrive from four different
         * directions - the router, the confirmation sheet, the permission gate and the
         * mode switch - and each of them used to resume or pause on its own reasoning.
         * That is how a sheet dismissed in Photo mode restarted a decoder that Photo
         * mode had just turned off.
         *
         * The one that is not about the mode: a device with no session yet is on the
         * activation screen, and the only way through it is to read an activation QR
         * code. The mode switch is not even on screen there, so it gets no vote.
         */
        get decoding() {
            if (!this.scanner || !this.active || this.cameraGate) return false;
            if (this.confirming) return false;
            if (!this.session) return true;
            return this.mode === 'qr';
        },

        syncDecoder() {
            if (!this.scanner) return;
            if (this.decoding) this.scanner.resume();
            else this.scanner.pause();
        },

        async toggleTorch() {
            const next = !this.torchOn;
            if (await this.scanner.setTorch(next)) this.torchOn = next;
        },

        async activate(token) {
            if (this.activating) return;
            this.activating = true;
            this.activationError = null;
            const result = await PWA.activate(token);
            if (result.ok) {
                if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
                this.flash = true;
                setTimeout(() => { this.flash = false; }, 500);
                this.signOutMessage = null;
                await this.refresh();
            } else {
                this.activationError = result.error;
            }
            this.activating = false;
        },

        activateManually() {
            const token = PWA.activationTokenFrom(this.manualToken.trim())
                || this.manualToken.trim();
            if (token) this.activate(token);
        },

        // Storage outranks everything below it. "Synced" while the outbox cannot be
        // read is the app claiming to have delivered receipts it cannot even count.
        get dotClass() {
            if (!this.storageOk) return 'is-offline';
            if (!this.online) return 'is-offline';
            if (this.syncing) return 'is-syncing';
            if (this.pending > 0) return 'is-pending';
            return 'is-synced';
        },

        get syncLabel() {
            if (!this.storageOk) return 'Storage problem';
            if (!this.online) return this.pending ? `Offline · ${this.pending} waiting` : 'Offline';
            if (this.syncing) return 'Syncing…';
            if (this.pending > 0) return `${this.pending} waiting`;
            return 'Synced';
        },

        /* Tapping the pill again, or six seconds of nobody touching it, closes it -
           this is a notification feed to glance at, not a screen to leave open. */
        toggleIsland() {
            this.islandExpanded = !this.islandExpanded;
            clearTimeout(this._islandTimer);
            if (this.islandExpanded) {
                this._islandTimer = setTimeout(() => { this.islandExpanded = false; }, 6000);
            }
        },

        eventWhen(at) {
            const seconds = Math.max(0, Math.round((Date.now() - at) / 1000));
            if (seconds < 5) return 'just now';
            if (seconds < 60) return `${seconds}s ago`;
            const minutes = Math.round(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            return `${Math.round(minutes / 60)}h ago`;
        },
    };
}
</script>
